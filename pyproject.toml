[project]
name = "coinlet"
version = "0.1.0"
description = "Continuous wavelet transforms for time series analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "coinlet contributors" }
]
keywords = ["wavelet", "cwt", "time-series", "crypto", "signal-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pywavelets>=1.4",
    "plotly>=5.18",
    "pyarrow>=14.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "duckdb>=1.0.0",
    "yfinance>=0.2.40",
    "click>=8.1.0",
]

[project.optional-dependencies]
notebook = [
    "marimo>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "responses>=0.25.0",
    "ruff>=0.4.0",
]

[project.scripts]
coinlet = "coinlet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coinlet"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
