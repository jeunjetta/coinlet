[project]
name = "coinlet"
version = "0.1.0"
description = "Continuous wavelet transforms for time series analysis"
readme = "README.md"
requires-python = ">=3.11.5"
license = "MIT"
authors = [
    { name = "coinlet contributors" }
]
keywords = ["wavelet", "cwt", "time-series", "crypto", "signal-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pywavelets>=1.4",
    "plotly>=5.18",
    "pyarrow>=14.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "duckdb>=1.0.0",
    "yfinance>=0.2.40",
    "click>=8.1.0",
]

[project.optional-dependencies]
notebook = [
    "marimo>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "responses>=0.25.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
coinlet = "coinlet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coinlet"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "W",      # pycodestyle warnings
    "S",      # flake8-bandit (security)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]  # Allow asserts and hardcoded passwords in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src/coinlet"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

# So `uv run marimo` / local edits resolve the in-repo package without a PyPI install.
[tool.marimo.runtime]
pythonpath = ["src"]
